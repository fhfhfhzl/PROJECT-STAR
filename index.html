<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171b3d">
  <title>PROJECT STAR</title>

  <link rel="stylesheet" href="src/style.css">
  <script src="src/script.js" defer></script>
</head>

<body>
  <main class="start-screen" aria-label="PROJECT STAR 시작 화면">
    <img
      class="start-screen-image"
      src="images/ui/start-screen.PNG"
      alt="PROJECT STAR 다섯 연습생과 게임 메뉴"
    >

    <nav class="start-menu" aria-label="메인 메뉴">
      <button
        class="start-menu-button game-start-button"
        type="button"
        data-menu="game-start"
        aria-label="게임 시작"
      ></button>

      <button
        class="start-menu-button collection-button"
        type="button"
        data-menu="collection"
        aria-label="도감"
      ></button>

      <button
        class="start-menu-button records-button"
        type="button"
        data-menu="records"
        aria-label="기록"
      ></button>

      <button
        class="start-menu-button settings-button"
        type="button"
        data-menu="settings"
        aria-label="설정"
      ></button>

      <button
        class="start-menu-button help-button"
        type="button"
        data-menu="help"
        aria-label="게임 방법"
      ></button>
    </nav>
  </main>
</body>
</html>
